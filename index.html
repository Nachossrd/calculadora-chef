<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FDF6EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Calculadora de compras y presupuestos para eventos y banquetería: cuánto comprar, cuánto rinde cada envase y cuánto gastarás.">
  <meta property="og:title" content="Calculadora de la Chef 🍳">
  <meta property="og:description" content="Cuánto comprar, cuánto rinde y cuánto gastarás en tu próximo evento.">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chef">
  <title>Calculadora de la Chef</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🍳</text></svg>">
  <script>
    /* Aplica el tema antes del primer pintado para evitar destellos */
    (function () {
      try {
        var t = localStorage.getItem('calculadora-chef-tema');
        if (t !== 'oscuro' && t !== 'claro') {
          t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'oscuro' : 'claro';
        }
        document.documentElement.dataset.tema = t;
      } catch (e) { /* sin almacenamiento */ }
    })();
  </script>
  <link rel="stylesheet" href="css/estilos.css?v=9">
</head>
<body>

  <main id="app"></main>

  <nav id="nav">
    <button data-vista="inicio" class="activo"><span>🏠</span>Inicio</button>
    <button data-vista="productos"><span>🧺</span>Productos</button>
    <button data-vista="recetas"><span>🥪</span>Recetas</button>
    <button data-vista="eventos"><span>🎉</span>Eventos</button>
  </nav>

  <div id="capa"></div>
  <div id="capa2"></div>
  <div id="toast"></div>

  <script src="js/conversion.js?v=9"></script>
  <script src="js/datos.js?v=9"></script>
  <script src="js/calculo.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
